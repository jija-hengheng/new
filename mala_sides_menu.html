<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ท็อปปิ้งชาบู | จิจะเฮงเฮง</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-red:#940109;
    --primary-red-dark:#6d0107;
    --gold:#c9a227;
    --gold-soft:#f1e2b4;
    --bg-cream:#fbf3e3;
    --bg-cream-deep:#f4e7cc;
    --card-white:#fffdf8;
    --ink:#2b1c12;
    --ink-soft:#8a7660;
    --shadow-soft:0 8px 20px rgba(43,28,18,0.09);
    --shadow-strong:0 12px 28px rgba(148,1,9,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg-cream); color:var(--ink);
    font-family:'Kanit',sans-serif; max-width:480px; margin-inline:auto;
    padding-bottom:104px; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Noto Serif Thai',serif; margin:0;}
  img{display:block;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
    padding:12px 16px; background:rgba(251,243,227,0.94); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--gold-soft);
  }
  .back-btn{
    width:34px; height:34px; border-radius:50%; background:var(--card-white); border:1px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center; color:var(--primary-red); text-decoration:none; flex-shrink:0;
    box-shadow:var(--shadow-soft);
  }
  .brand-mark{
    width:38px; height:38px; border-radius:50%; flex-shrink:0; overflow:hidden;
    background:var(--primary-red); border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-mark .fallback-mark{color:#fff; font-family:'Noto Serif Thai',serif; font-weight:700; font-size:1rem;}
  .header-text{flex-grow:1; min-width:0;}
  .header-text .title{font-size:0.98rem; font-weight:600; color:var(--primary-red); font-family:'Noto Serif Thai',serif; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .header-text .sub{font-size:0.68rem; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .header-cart{
    position:relative; width:38px; height:38px; border-radius:50%; background:var(--card-white); border:1px solid var(--gold-soft);
    display:flex; align-items:center; justify-content:center; color:var(--primary-red); flex-shrink:0; box-shadow:var(--shadow-soft);
  }
  .header-cart .badge{
    position:absolute; top:-4px; right:-4px; background:var(--primary-red); color:#fff; font-size:0.62rem; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px;
    border:1.5px solid var(--bg-cream);
  }

  /* ---------- Hero ---------- */
  .hero-wrap{padding:14px 16px 6px;}
  .hero{
    position:relative; border-radius:22px; overflow:hidden; min-height:158px;
    background:
      radial-gradient(circle at 82% 20%, rgba(255,255,255,0.16), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(135deg, var(--primary-red) 0%, var(--primary-red-dark) 65%, #4c0104 100%);
    box-shadow:var(--shadow-strong);
    display:flex; align-items:center; padding:18px;
  }
  .hero::before{
    content:""; position:absolute; inset:6px; border:1px solid rgba(201,162,39,0.55); border-radius:17px; pointer-events:none;
  }
  .hero-corner{position:absolute; width:16px; height:16px; border:2px solid var(--gold);}
  .hero-corner.tl{top:10px; left:10px; border-right:none; border-bottom:none; border-top-left-radius:6px;}
  .hero-corner.br{bottom:10px; right:10px; border-left:none; border-top:none; border-bottom-right-radius:6px;}
  .hero-content{position:relative; z-index:2; max-width:63%;}
  .hero-eyebrow{color:var(--gold-soft); font-size:0.68rem; letter-spacing:1.5px; margin-bottom:6px; font-weight:500;}
  .hero-content h1{color:#fff; font-size:1.5rem; line-height:1.25; font-weight:800; margin-bottom:6px;}
  .hero-content p{color:rgba(255,255,255,0.82); font-size:0.75rem; line-height:1.5; margin:0;}
  .hero-pot{
    position:absolute; right:-14px; bottom:-14px; width:120px; height:120px; opacity:0.9;
  }
  .hero-pot svg{width:100%; height:100%;}

  /* ---------- Category nav ---------- */
  .cat-nav-wrap{
    position:sticky; top:59px; z-index:35; background:var(--bg-cream); padding:14px 0 8px;
    border-bottom:1px solid var(--bg-cream-deep);
  }
  .cat-nav{
    display:flex; gap:14px; overflow-x:auto; padding:0 16px 4px; scrollbar-width:none;
  }
  .cat-nav::-webkit-scrollbar{display:none;}
  .cat-chip{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; width:60px;
    background:none; border:none; cursor:pointer; color:var(--ink-soft);
  }
  .cat-chip .ring{
    width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--card-white); border:2px solid var(--gold-soft); position:relative; transition:.2s;
    box-shadow:var(--shadow-soft);
  }
  .cat-chip .ring::after{
    content:""; position:absolute; inset:-5px; border-radius:50%; border:1px solid transparent; transition:.2s;
  }
  .cat-chip svg{width:24px; height:24px; stroke:var(--primary-red); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round;}
  .cat-chip span{font-size:0.64rem; font-weight:500; white-space:nowrap;}
  .cat-chip.active .ring{background:var(--primary-red); border-color:var(--primary-red);}
  .cat-chip.active .ring::after{border-color:var(--gold);}
  .cat-chip.active svg{stroke:#fff;}
  .cat-chip.active span{color:var(--primary-red); font-weight:600;}

  /* ---------- Section / category headers ---------- */
  .t-container{padding:0 16px;}
  .category-header{display:flex; align-items:baseline; gap:8px; margin:26px 2px 12px; scroll-margin-top:130px;}
  .category-header h2{font-size:1.02rem; color:var(--primary-red); font-weight:700; white-space:nowrap;}
  .category-header .cat-count{font-size:0.68rem; color:var(--ink-soft); font-weight:400;}
  .category-header::after{content:""; height:1px; flex-grow:1; background:linear-gradient(to right, var(--gold), transparent);}

  /* ---------- Grid / Cards ---------- */
  .grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;}
  .card{
    background:var(--card-white); border-radius:14px; overflow:visible; display:flex; flex-direction:column;
    box-shadow:var(--shadow-soft); border:2px solid transparent; transition:.2s;
  }
  .card.selected{border-color:var(--primary-red); box-shadow:0 0 0 3px rgba(148,1,9,0.10), var(--shadow-soft);}
  .image-wrap{position:relative;}
  .image-container{
    width:100%; aspect-ratio:1/1; overflow:hidden; background:var(--bg-cream-deep);
    border-radius:14px 14px 0 0; position:relative;
  }
  .card img{width:100%; height:100%; object-fit:cover;}
  .image-container.img-fallback{display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, var(--gold-soft), var(--bg-cream-deep));}
  .image-container.img-fallback::after{content:attr(data-label); font-family:'Noto Serif Thai',serif; font-weight:700; color:var(--primary-red); font-size:1rem;}
  .new-ribbon{
    position:absolute; top:6px; left:-6px; background:var(--primary-red); color:#fff; font-size:0.52rem; font-weight:600;
    padding:1px 7px 1px 9px; border-radius:0 3px 3px 0; box-shadow:0 2px 5px rgba(0,0,0,0.2);
  }
  .new-ribbon::before{content:""; position:absolute; left:0; bottom:-4px; border-width:4px 5px 0 0; border-style:solid; border-color:var(--primary-red-dark) transparent transparent transparent;}

  .info{padding:7px 6px 10px; text-align:left; flex-grow:1;}
  .name{font-size:0.66rem; font-weight:400; color:var(--ink); margin-bottom:4px; line-height:1.22; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:1.85em;}
  .price-tag{color:var(--primary-red); font-weight:700; font-size:0.82rem; font-family:'Noto Serif Thai',serif;}
  .price-tag::after{content:" บาท"; font-size:0.56rem; font-weight:400; color:var(--ink-soft);}

  .qty-overlay{position:absolute; right:6px; bottom:-13px; z-index:2;}
  .add-btn{
    width:27px; height:27px; border-radius:50%; background:var(--primary-red); color:#fff; border:2.5px solid var(--card-white);
    box-shadow:var(--shadow-strong); font-size:0.95rem; line-height:1; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .stepper{
    display:flex; align-items:center; gap:5px; background:var(--card-white); border-radius:16px; padding:3px 5px;
    box-shadow:var(--shadow-strong); border:1px solid var(--gold-soft);
  }
  .stepper button{
    width:19px; height:19px; border-radius:50%; background:var(--primary-red); color:#fff; border:none; cursor:pointer; font-size:0.75rem; line-height:1;
  }
  .stepper .count{min-width:11px; text-align:center; font-weight:700; color:var(--primary-red); font-size:0.7rem;}

  /* ---------- Footer note ---------- */
  .footer-note{text-align:center; padding:30px 24px 8px; color:var(--ink-soft); font-size:0.7rem; line-height:1.6;}

  /* ---------- Floating cart bar ---------- */
  .cart-bar{
    position:fixed; left:16px; right:16px; bottom:14px; max-width:448px; margin-inline:auto;
    background:linear-gradient(135deg, var(--primary-red), var(--primary-red-dark));
    border-radius:18px; padding:11px 12px 11px 16px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:var(--shadow-strong); color:#fff; transform:translateY(140%); transition:transform .32s cubic-bezier(.2,.8,.2,1); z-index:50;
    padding-bottom:calc(11px + env(safe-area-inset-bottom));
  }
  .cart-bar.show{transform:translateY(0);}
  .cart-bar .left{display:flex; align-items:center; gap:10px; min-width:0;}
  .cart-bar .badge{
    background:#fff; color:var(--primary-red); border-radius:50%; width:28px; height:28px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.82rem;
  }
  .cart-bar .text-block{min-width:0;}
  .cart-bar .info-text{font-size:0.66rem; opacity:0.85; white-space:nowrap;}
  .cart-bar .total-price{font-family:'Noto Serif Thai',serif; font-weight:700; font-size:1.02rem; white-space:nowrap;}
  .cart-bar .cta{
    background:#fff; color:var(--primary-red); border:none; border-radius:13px; padding:10px 16px; font-weight:600;
    font-size:0.82rem; flex-shrink:0; cursor:pointer; white-space:nowrap;
  }

  @media (max-width:340px){
    .name{font-size:0.6rem;} .price-tag{font-size:0.75rem;}
  }
</style>
</head>

    { sku: 'TP047', category: 'หมวดไข่ – เมนูพิเศษ', name: 'ต๊อกบกกีไส้ชีส', image: 'tokcheese.png', price: 10 },
    { sku: 'TP043', category: 'หมวดไข่ – เมนูพิเศษ', name: 'ไข่นกกระทา', image: 'nokgataegg.png', price: 10 },
    { sku: 'TP044', category: 'หมวดไข่ – เมนูพิเศษ', name: 'ไข่ไก่', image: 'egg.png', price: 10 },
    { sku: 'NJ003', category: 'หมวดน้ำจิ้ม 100 ml', name: 'น้ำจิ้มสุกี้กวางตุ้ง', image: 'N-suki.png', price: 15 },
    { sku: 'NJ001', category: 'หมวดน้ำจิ้ม 100 ml', name: 'น้ำจิ้มงาคั่วหม่าล่า', image: 'N-mala.png', price: 29 },
    { sku: 'NJ002', category: 'หมวดน้ำจิ้ม 100 ml', name: 'น้ำจิ้มงาคั่วหอม', image: 'N-vha.png', price: 25 },
  ];

  /* Cheese / topping items get pulled into their own category and shown first */
  const CHEESE_SKUS = ['TP025', 'TP026', 'TP045', 'TP047', 'TP050'];
  const CHEESE_LABEL = 'ท็อปปิ้งพิเศษ · ชีส';

  const CATEGORY_META = {
    [CHEESE_LABEL]:                        { label: 'ท็อปปิ้งชีส',  icon: 'cheese', order: 0 },
    'หมวดข้าว':                             { label: 'ข้าว',         icon: 'rice',   order: 1 },
    'หมวดเนื้อหมู':                         { label: 'เนื้อหมู',      icon: 'meat',   order: 2 },
    'หมวดลูกชิ้น – ไส้กรอก – ทะเล':          { label: 'ลูกชิ้น-ทะเล',  icon: 'skewer', order: 3 },
    'หมวดเต้าหู้':                          { label: 'เต้าหู้',       icon: 'tofu',   order: 4 },
    'หมวดผัก – เส้น':                       { label: 'ผัก-เส้น',      icon: 'leaf',   order: 5 },
    'หมวดไข่ – เมนูพิเศษ':                  { label: 'ไข่พิเศษ',      icon: 'egg',    order: 6 },
    'หมวดน้ำจิ้ม 100 ml':                   { label: 'น้ำจิ้ม',       icon: 'sauce',  order: 7 },
    'กลุ่มเส้นหนึบ':                        { label: 'เส้นหนึบ',      icon: 'noodle', order: 8 },
    'ซุปและพริกหม่าล่า':                    { label: 'ซุป-พริก',      icon: 'chili',  order: 9 },
    'เครื่องเคียงและฟองเต้าหู้':             { label: 'เครื่องเคียง',   icon: 'side',   order: 10 },
  };

  const ICONS = {
    cheese: '<path d="M3 18h18l-3.2-9.6a1 1 0 0 0-1.5-.5L12 11 7.7 7.9a1 1 0 0 0-1.5.5L3 18z"/><circle cx="9.5" cy="14.5" r=".6" fill="currentColor" stroke="none"/><circle cx="14.5" cy="15" r=".6" fill="currentColor" stroke="none"/>',
    rice:   '<path d="M3 12h18a9 6 0 0 1-18 0z"/><path d="M12 12V6"/><path d="M9 8l3-2 3 2"/>',
    meat:   '<circle cx="9.5" cy="9.5" r="5"/><path d="M13 13l5.5 5.5"/><path d="M17 17a2.3 2.3 0 1 0 3.3 3.3A2.3 2.3 0 0 0 17 17z"/>',
    skewer: '<line x1="4" y1="20" x2="20" y2="4"/><circle cx="8.5" cy="15.5" r="2.1"/><circle cx="12.5" cy="11.5" r="2.1"/><circle cx="16.5" cy="7.5" r="1.9"/>',
    tofu:   '<rect x="5" y="5" width="14" height="14" rx="2"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="12" y1="5" x2="12" y2="19"/>',
    leaf:   '<path d="M4 20c8 0 16-8 16-16-8 0-16 8-16 16z"/><path d="M5.5 18.5c4-4 8-8 12-12"/>',
    egg:    '<ellipse cx="12" cy="13" rx="6" ry="8"/>',
    sauce:  '<path d="M4 10h16a8 5 0 0 1-16 0z"/><path d="M12 10V4.5"/><circle cx="12" cy="3.2" r="1"/>',
    noodle: '<path d="M3 8c2-3 4 3 6 0s4 3 6 0 4 3 6 0"/><path d="M3 14c2-3 4 3 6 0s4 3 6 0 4 3 6 0"/>',
    chili:  '<path d="M4 9h16l-1.6 9.2A2 2 0 0 1 16.4 20H7.6a2 2 0 0 1-2-1.8z"/><path d="M2 9h20"/><path d="M9 9V6.5a3 3 0 0 1 6 0V9"/>',
    side:   '<circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3"/>',
  };

  let selectedItems = {};

  function buildCategorized() {
    const items = ITEMS_DATA.map(i => ({ ...i }));
    items.forEach(i => { if (CHEESE_SKUS.includes(i.sku)) i.category = CHEESE_LABEL; });

    const grouped = {};
    items.forEach(i => { (grouped[i.category] = grouped[i.category] || []).push(i); });
    Object.keys(grouped).forEach(c => grouped[c].sort((a, b) => a.price - b.price));

    const orderedCats = Object.keys(grouped).sort(
      (a, b) => (CATEGORY_META[a]?.order ?? 99) - (CATEGORY_META[b]?.order ?? 99)
    );
    return { grouped, orderedCats };
  }

  function slugify(cat) { return cat.replace(/[^a-zA-Zก-๙0-9]/g, ''); }

  function renderNav(orderedCats) {
    const nav = document.getElementById('cat-nav');
    nav.innerHTML = orderedCats.map((cat, idx) => {
      const meta = CATEGORY_META[cat] || { label: cat, icon: 'side' };
      return `
        <button class="cat-chip${idx === 0 ? ' active' : ''}" id="chip-${slugify(cat)}" onclick="scrollToCat('${slugify(cat)}')">
          <span class="ring"><svg viewBox="0 0 24 24">${ICONS[meta.icon] || ICONS.side}</svg></span>
          <span>${meta.label}</span>
        </button>`;
    }).join('');
  }

  function scrollToCat(id) {
    const el = document.getElementById('sec-' + id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function renderItems() {
    const { grouped, orderedCats } = buildCategorized();
    renderNav(orderedCats);

    const container = document.getElementById('menu-sections');
    let html = '';
    orderedCats.forEach(cat => {
      const meta = CATEGORY_META[cat] || { label: cat };
      const items = grouped[cat];
      html += `<div class="category-header" id="sec-${slugify(cat)}"><h2>${meta.label}</h2><span class="cat-count">${items.length} รายการ</span></div><div class="grid">`;
      items.forEach(item => {
        const sel = selectedItems[item.sku];
        const shortLabel = item.name.slice(0, 2);
        html += `
          <div class="card ${sel ? 'selected' : ''}" id="card-${item.sku}">
            <div class="image-wrap">
              <div class="image-container" data-label="${shortLabel}">
                ${item.isNew ? '<span class="new-ribbon">ใหม่</span>' : ''}
                <img src="images/${item.image}" alt="${item.name}" loading="lazy"
                     onerror="this.style.display='none'; this.parentElement.classList.add('img-fallback')">
              </div>
              <div class="qty-overlay">
                ${sel
                  ? `<div class="stepper">
                       <button onclick="changeCount(event,'${item.sku}',-1)" aria-label="ลด">−</button>
                       <span class="count" id="count-${item.sku}">${sel.count}</span>
                       <button onclick="changeCount(event,'${item.sku}',1)" aria-label="เพิ่ม">+</button>
                     </div>`
                  : `<button class="add-btn" onclick="selectItem('${item.sku}')" aria-label="เพิ่ม ${item.name}">+</button>`
                }
              </div>
            </div>
            <div class="info">
              <div class="name">${item.name}</div>
              <div class="price-tag">${item.price.toLocaleString()}</div>
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    container.innerHTML = html;
    setupScrollSpy(orderedCats);
  }

  function setupScrollSpy(orderedCats) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const id = entry.target.id.replace('sec-', '');
          document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
          const chip = document.getElementById('chip-' + id);
          if (chip) chip.classList.add('active');
        }
      });
    }, { rootMargin: '-140px 0px -70% 0px', threshold: 0 });
    orderedCats.forEach(cat => {
      const el = document.getElementById('sec-' + slugify(cat));
      if (el) observer.observe(el);
    });
  }

  function selectItem(sku) {
    if (selectedItems[sku]) {
      delete selectedItems[sku];
    } else {
      const item = ITEMS_DATA.find(i => i.sku === sku);
      if (!item) return;
      selectedItems[sku] = { ...item, count: 1 };
    }
    renderItems();
    updateFooter();
  }

  function changeCount(event, sku, delta) {
    event.stopPropagation();
    if (!selectedItems[sku]) return;
    const newCount = selectedItems[sku].count + delta;
    if (newCount <= 0) {
      delete selectedItems[sku];
      renderItems();
    } else {
      selectedItems[sku].count = newCount;
      document.getElementById(`count-${sku}`).innerText = newCount;
    }
    updateFooter();
  }

  function updateFooter() {
    const items = Object.values(selectedItems);
    const totalCount = items.reduce((sum, i) => sum + i.count, 0);
    const totalPrice = items.reduce((sum, i) => sum + i.count * i.price, 0);

    document.getElementById('cart-total').innerText = `${totalPrice.toLocaleString()} บาท`;
    document.getElementById('cart-badge').innerText = totalCount;
    document.getElementById('header-badge').innerText = totalCount;
    document.getElementById('header-badge').style.display = totalCount > 0 ? 'flex' : 'none';

    const bar = document.getElementById('cart-bar');
    if (totalCount > 0) bar.classList.add('show');
    else bar.classList.remove('show');
  }

  function placeOrder() {
    const items = Object.values(selectedItems);
    if (items.length === 0) return;

    const orderItems = items.map(item => ({
      sku: item.sku,
      name: item.name,
      price: item.price,
      count: item.count,
      type: 'Topping'
    }));

    const totalCount = items.reduce((sum, i) => sum + i.count, 0);
    const totalPrice = items.reduce((sum, i) => sum + i.count * i.price, 0);

    const finalOrderSet = {
      name: `วัตถุดิบชาบูหม่าล่า (${totalCount} รายการ)`,
      price: totalPrice,
      count: 1,
      details: orderItems,
      isSidesOnly: true
    };

    let cartItems = JSON.parse(sessionStorage.getItem('cartItems') || '[]');
    cartItems.push(finalOrderSet);
    sessionStorage.setItem('cartItems', JSON.stringify(cartItems));

    window.location.href = 'summary.html';
  }

  document.getElementById('header-cart-btn').addEventListener('click', () => {
    document.getElementById('cart-bar').scrollIntoView({ behavior: 'smooth', block: 'end' });
  });

  document.addEventListener('DOMContentLoaded', () => {
    renderItems();
    updateFooter();
  });
</script>
