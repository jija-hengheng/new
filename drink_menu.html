<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูเครื่องดื่ม - จิจะ เฮงเฮง</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="remote-status.js"></script>
    <style>
        body { padding-bottom: 110px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; max-width: 600px; margin: auto; padding: 0 4px; }
        .menu-item { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 16px rgba(43,28,18,0.08); display: flex; flex-direction: column; position: relative; border: 1px solid rgba(148, 1, 9, 0.06); }
        .menu-img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 5px; box-sizing: border-box; }
        
        .menu-info { padding: 8px 10px; text-align: center; flex-grow: 1; }
        .menu-name { font-weight: 500; font-size: 0.88rem; height: 2.4em; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; color: var(--ink); }
        .menu-price { color: var(--primary-red); font-weight: 700; font-size: 1.02rem; margin-bottom: 8px; }
        
        .flavor-picker { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-bottom: 9px; }
        .flavor-chip {
            padding: 5px 10px; border-radius: 20px; border: 1.5px solid var(--primary-red);
            background: #fff; color: var(--primary-red); font-family: inherit; font-size: 0.7rem;
            font-weight: 500; cursor: pointer; transition: 0.15s;
        }
        .flavor-chip.active { background: linear-gradient(135deg, var(--primary-red), var(--dark-red)); color: #fff; box-shadow: 0 3px 8px rgba(148,1,9,0.3); }

        .qty-control { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; }
        .btn-qty { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--primary-red); background: #fdfdfd; cursor: pointer; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; color: var(--primary-red); }
        .qty-val { font-weight: 700; min-width: 20px; font-size: 1.05rem; }

        .add-btn { width: 100%; padding: 11px; background: linear-gradient(135deg, var(--primary-red), var(--dark-red)); color: var(--cream-soft); border: none; font-weight: 600; border-radius: 0 0 16px 16px; cursor: pointer; }

        .floating-cart {
            position: fixed; bottom: 22px; right: 18px;
            width: 68px; height: 68px;
            background: linear-gradient(155deg, var(--primary-red), var(--dark-red)); color: var(--cream-soft);
            border-radius: 50%; border: 3px solid var(--gold-soft);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 8px 22px rgba(148,1,9,0.4);
            text-decoration: none; z-index: 1000;
        }
        .cart-icon { font-size: 1.5rem; margin-bottom: -2px; }
        .badge {
            position: absolute; top: -2px; right: -2px;
            background: var(--gold); color: #3a2a00;
            font-size: 0.8rem; font-weight: 800;
            width: 23px; height: 23px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="themed">

    <div class="mini-header">
        <a href="index.html" class="back-btn">←</a>
        <img src="images/2.png" class="mini-logo" alt="จิจะเฮงเฮง">
        <div>
            <div class="mini-title">🥤 เครื่องดื่ม</div>
            <div class="mini-sub">สดชื่น พร้อมแก้วฟรีน้ำแข็งทุกเมนู</div>
        </div>
    </div>

    <div class="t-container" style="padding-top:14px;">
    <div class="menu-grid" id="menu-container">
        </div>
    </div>

    <a href="summary.html" class="floating-cart" id="btn-summary">
        <span class="badge" id="cart-count">0</span>
        <span class="cart-icon">🛒</span>
        <span style="font-size: 0.65rem; font-weight: 700;">สั่งเลย</span>
    </a>

    <script>
        // sku อ้างอิงจาก export_items.csv (Loyverse POS)
        const drinks = [
            { name: 'โค้ก + แก้วน้ำแข็ง', price: 25, img: 'images/coke.png', sku: 'D0003' },
            { name: 'แฟนต้า บลูเบอร์รี่ + แก้วน้ำแข็ง', price: 25, img: 'images/fanta.png', sku: 'D0009' },
            { name: 'น้ำฟักเขียว + แก้วน้ำแข็ง', price: 25, img: 'images/fuk.png', sku: 'D0007' },
            { name: 'น้ำเก๊กฮวย + แก้วน้ำแข็ง', price: 25, img: 'images/gek.png', sku: 'D0004' },
            { name: 'น้ำจับเลี้ยง + แก้วน้ำแข็ง', price: 25, img: 'images/jup.png', sku: 'D0005' },
            { name: 'น้ำลำไย + แก้วน้ำแข็ง', price: 25, img: 'images/lum.png', sku: 'D0006' },
            { name: 'น้ำดื่มขวด', price: 10, img: 'images/water.png', sku: 'D0002' },
            { name: 'Loveza + แก้วน้ำแข็ง', price: 25, img: 'images/Loveza.png', options: [
                { label: 'ลิ้นจี่', sku: 'Love01' },
                { label: 'องุ่นเคียวโฮ', sku: 'Love03' },
                { label: 'ฮันนี่เลม่อน', sku: 'Love02' }
            ] }
        ];

        let cart = JSON.parse(sessionStorage.getItem('cartItems') || '[]');

        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = drinks.map((item, idx) => `
                <div class="menu-item" id="card-${item.sku || (item.options && item.options[0].sku) || ('idx' + idx)}">
                    <img src="${item.img}" class="menu-img" onerror="this.src='https://placehold.co/300x300?text=No+Image'">
                    <div class="menu-info">
                        <div class="menu-name">${item.name}</div>
                        <div class="menu-price">${item.price} บ.</div>
                        ${item.options ? `
                        <div class="flavor-picker" id="flavor-${idx}">
                            ${item.options.map((opt, oi) => `<button type="button" class="flavor-chip${oi === 0 ? ' active' : ''}" data-sku="${opt.sku}" data-label="${opt.label}" onclick="selectFlavor(${idx}, this)">${opt.label}</button>`).join('')}
                        </div>` : ''}
                        <div class="qty-control">
                            <button class="btn-qty" onclick="changeQty('qty-${idx}', -1)">-</button>
                            <span class="qty-val" id="qty-${idx}">1</span>
                            <button class="btn-qty" onclick="changeQty('qty-${idx}', 1)">+</button>
                        </div>
                    </div>
                    <button class="add-btn" onclick="addToCart(${idx})">เพิ่มลงตะกร้า</button>
                </div>
            `).join('');
            updateCartCount();
        }

        function selectFlavor(idx, chipEl) {
            const wrap = document.getElementById(`flavor-${idx}`);
            wrap.querySelectorAll('.flavor-chip').forEach(c => c.classList.remove('active'));
            chipEl.classList.add('active');
        }

        function changeQty(id, delta) {
            const el = document.getElementById(id);
            let val = parseInt(el.innerText) + delta;
            if (val < 1) val = 1; 
            el.innerText = val;
        }

        function addToCart(idx) {
            const item = drinks[idx];
            const qtyId = `qty-${idx}`;
            const quantity = parseInt(document.getElementById(qtyId).innerText);

            let name = item.name;
            let sku = item.sku;

            if (item.options) {
                const wrap = document.getElementById(`flavor-${idx}`);
                const activeChip = wrap.querySelector('.flavor-chip.active');
                name = `${item.name} - ${activeChip.dataset.label}`;
                sku = activeChip.dataset.sku;
            }

            // 🔧 FIX: เดิมใช้ for loop ที่เพิ่มรายการแยกกัน quantity ครั้ง
            // ตอนนี้เก็บ count แทน เพื่อให้ summary.html แสดงจำนวนถูกต้อง
            cart.push({
                name: name,
                price: item.price,
                sku: sku,
                count: quantity,
                details: []
            });

            sessionStorage.setItem('cartItems', JSON.stringify(cart));
            updateCartCount();
            
            // เอฟเฟกต์เด้งที่ปุ่มสรุปยอดเวลาเพิ่มของ
            const btn = document.getElementById('btn-summary');
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 200);

            document.getElementById(qtyId).innerText = "1";
        }

        function updateCartCount() {
            // 🔧 FIX: นับจำนวนสินค้าจริง (รวม count ของแต่ละ item)
            const totalItems = cart.reduce((sum, item) => sum + (item.count || 1), 0);
            document.getElementById('cart-count').innerText = totalItems;
        }

        renderMenu();
        // 🔧 FIX: ส่ง catalogs ให้ RemoteStatus.init เพื่อให้ราคาลดมีผลจริง
        RemoteStatus.init({ 
            categoryKey: 'drink_menu', 
            catalogs: [{ items: drinks, keyFn: it => it.sku || (it.options && it.options[0].sku) }],
            renderFn: renderMenu
        });
    </script>
</body>
</html>
